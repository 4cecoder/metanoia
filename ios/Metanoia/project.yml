name: Metanoia
options:
  bundleIdPrefix: com.bytecats
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:
  Metanoia:
    type: application
    platform: iOS
    sources:
      - Metanoia
    resources:
      - ../data/bible.db
      - ../data/voices.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bytecats.metanoia
        MARKETING_VERSION: "2026.08.11"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_GENERATION_MODE: GeneratedFile
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies: []
