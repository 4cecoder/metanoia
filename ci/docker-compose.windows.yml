services:
  windows:
    image: dockurr/windows:latest
    container_name: metanoia-windows
    environment:
      VERSION: "11"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "40G"
      USERNAME: "metanoia"
      PASSWORD: "metanoia"
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389
    volumes:
      - windows-data:/storage
      - ..:/workspace
      - ./win-build.ps1:/storage/win-build.ps1
    stop_grace_period: 2m

volumes:
  windows-data:
