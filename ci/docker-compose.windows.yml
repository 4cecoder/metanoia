services:
  # Windows 11 headless VM via dockur (requires KVM — Linux hosts only)
  # Access web UI at http://localhost:8006 or RDP at localhost:3389
  windows:
    image: dockurr/windows:latest
    container_name: metanoia-windows
    environment:
      VERSION: "11"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "40G"
      USERNAME: "metanoia"
      PASSWORD: "metanoia"
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389
    volumes:
      - windows-data:/storage
      - .:/workspace
      - ./ci/win-build.ps1:/storage/win-build.ps1
    stop_grace_period: 2m

volumes:
  windows-data:
