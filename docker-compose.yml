services:
  # Cross-compile Zig for x86_64-windows-gnu target from Linux
  crosscheck:
    build:
      context: .
      dockerfile: ci/Dockerfile.crosscheck
    working_dir: /workspace
    volumes:
      - .:/workspace
    profiles:
      - check

  # Validate C# setup wizard compiles via Mono
  wizard:
    image: mono:6.12
    working_dir: /workspace
    volumes:
      - .:/workspace
    entrypoint: ["/workspace/ci/wizard.sh"]
    profiles:
      - check
